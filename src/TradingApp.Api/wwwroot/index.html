<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TradingApp API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b1220;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #111a2e;
            border: 1px solid #1f2a44;
            border-radius: 12px;
            padding: 40px 48px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #4fc3f7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #8b9bb4;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #172239;
            border: 1px solid #223152;
            border-radius: 8px;
            color: #e6edf3;
            text-decoration: none;
            transition: all .15s ease;
        }

        a:hover {
            background: #1d2b48;
            border-color: #4fc3f7;
            transform: translateY(-1px);
        }

        .label {
            font-weight: 600;
        }

        .desc {
            color: #8b9bb4;
            font-size: 12px;
            margin-top: 2px;
        }

        .arrow {
            color: #4fc3f7;
            font-size: 18px;
        }

        .badge {
            display: inline-block;
            background: #0d2f1f;
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>TradingApp API</h1>
        <div class="subtitle">Demo Trading Platform <span class="badge">Phase 3</span></div>

        <div class="links">
            <a href="/swagger">
                <div>
                    <div class="label">Swagger UI</div>
                    <div class="desc">API dokümantasyonu ve interaktif test</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="/health/live">
                <div>
                    <div class="label">Liveness</div>
                    <div class="desc">Servis ayakta mı?</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="/health/ready">
                <div>
                    <div class="label">Readiness</div>
                    <div class="desc">Postgres + Redis bağlantı durumu</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="/api/system/ping">
                <div>
                    <div class="label">Ping</div>
                    <div class="desc">Basit sağlık kontrolü</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="/api/assets">
                <div>
                    <div class="label">Assets</div>
                    <div class="desc">Tüm aktif asset'ler (JSON)</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="/api/market/BTC">
                <div>
                    <div class="label">BTC Fiyatı</div>
                    <div class="desc">Anlık fiyat + 24s değişim</div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>
</body>

</html>
