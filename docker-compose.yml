services:
  # ============ PostgreSQL ============
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingdb
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d tradingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ Trading API ============
  trading-api:
    build:
      context: .
      dockerfile: src/TradingApp.Api/Dockerfile
    container_name: trading-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=tradingdb;Username=trading;Password=trading_dev_pwd"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "TradingApp"
      Jwt__Audience: "TradingApp.Client"
      Jwt__Key: "dev-only-super-secret-key-change-me-please-1234567890"
      Jwt__AccessTokenMinutes: "30"
      Jwt__RefreshTokenDays: "7"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      MarketData__Provider: "Yahoo"
      MarketData__BistDataService__BaseUrl: "http://host.docker.internal:8000"
    ports:
      - "5000:8080"
  # ============ Frontend (React + Nginx) ============
  frontend:
    build:
      context: ./frontend/trading-app-web
      dockerfile: Dockerfile
    container_name: trading-frontend
    restart: unless-stopped
    depends_on:
      - trading-api
    ports:
      - "3000:80"

  # ============ pgAdmin ============
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data: